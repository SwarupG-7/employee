
{% extends "base.html" %}

{% block title %}{{ page_title }} | PeopleDesk{% endblock %}

{% block page_heading %}{{ page_title }}{% endblock %}

{% block content %}

<div class="welcome-row">

    <div>
        <h1>{{ page_title }}</h1>

        <p class="muted">
            Enter employee information below.
        </p>
    </div>

    <a href="{{ url_for('employees') }}"
       class="button button-secondary">
        ← Back
    </a>

</div>


<div class="form-card">

    <form method="POST">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <h3 class="form-section-title">
            Employee Information
        </h3>

        <div class="form-grid">

            <label>
                Employee ID *

                <input type="text"
                       name="employee_code"
                       value="{{ employee.employee_code if employee else '' }}"
                       placeholder="EMP-001"
                       required>
            </label>


            <label>
                Full Name *

                <input type="text"
                       name="full_name"
                       value="{{ employee.full_name if employee else '' }}"
                       placeholder="Employee name"
                       required>
            </label>


            <label>
                Email Address

                <input type="email"
                       name="email"
                       value="{{ employee.email if employee else '' }}"
                       placeholder="employee@gmail.com">
            </label>


            <label>
                Phone Number

                <input type="tel"
                       name="phone"
                       value="{{ employee.phone if employee else '' }}"
                       placeholder="Phone number">
            </label>


            <label>
                Department *

                <input type="text"
                       name="department"
                       value="{{ employee.department if employee else '' }}"
                       placeholder="Human Resources"
                       required>
            </label>


            <label>
                Designation

                <input type="text"
                       name="designation"
                       value="{{ employee.designation if employee else '' }}"
                       placeholder="HR Executive">
            </label>


            <label>
                Joining Date

                <input type="date"
                       name="joining_date"
                       value="{{ employee.joining_date if employee else '' }}">
            </label>


            <label>
                Employment Status

                <select name="status">

                    <option value="Active"
                    {% if not employee or employee.status == 'Active' %}
                        selected
                    {% endif %}>
                        Active
                    </option>

                    <option value="Inactive"
                    {% if employee and employee.status == 'Inactive' %}
                        selected
                    {% endif %}>
                        Inactive
                    </option>

                </select>
            </label>

        </div>


        <div class="form-actions">

            <a href="{{ url_for('employees') }}"
               class="button button-quiet">
                Cancel
            </a>

            <button type="submit"
                    class="button button-primary">
                Save Employee
            </button>

        </div>

    </form>

</div>

{% endblock %}
